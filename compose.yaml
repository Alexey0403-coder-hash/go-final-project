services:
  scheduler:
    build: .
    image: scheduler:latest
    container_name: scheduler-container

    ports:
      - "7540:7540"

    environment:
      TODO_PORT: "7540"
      TODO_DBFILE: "/data/scheduler.db"
      TODO_PASSWORD: "${TODO_PASSWORD:-}"

    volumes:
      - scheduler-data:/data

volumes:
  scheduler-data: